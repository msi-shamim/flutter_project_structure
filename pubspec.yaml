name: flutter_project_structure
description: >-
  Save 90% of AI tokens. Analyze Flutter/Dart project structure, generate
  AI-friendly context (CLAUDE.md, .ai-context/) and MCP server for live querying.
version: 2.0.2
homepage: https://github.com/msi-shamim/flutter_project_structure
repository: https://github.com/msi-shamim/flutter_project_structure
issue_tracker: https://github.com/msi-shamim/flutter_project_structure/issues
license: MIT
topics:
  - flutter
  - dart
  - ai
  - code-analysis
  - mcp

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  analyzer: '>=7.1.0 <13.0.0'
  path: ^1.9.1
  args: ^2.6.0
  yaml: ^3.1.3
  mcp_dart: ^2.1.0
  watcher: ^1.1.0

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.14

executables:
  flutter_project_structure: flutter_project_structure
