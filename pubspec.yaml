name: flutter_project_structure
description: >-
  Make a Flutter/Dart codebase AI-ready: API skeletons, an import graph,
  CLAUDE.md and an MCP server give agents full project context cheaply.
version: 3.0.0
homepage: https://github.com/msi-shamim/flutter_project_structure
repository: https://github.com/msi-shamim/flutter_project_structure
issue_tracker: https://github.com/msi-shamim/flutter_project_structure/issues
license: MIT
topics:
  - flutter
  - dart
  - ai
  - code-analysis
  - mcp

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  analyzer: '>=7.1.0 <15.0.0'
  path: ^1.9.1
  args: ^2.6.0
  yaml: ^3.1.3
  mcp_dart: ^2.1.0
  watcher: ^1.1.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0

executables:
  flutter_project_structure: flutter_project_structure
